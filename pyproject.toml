[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sizzler-fuzzer"
version = "0.1.0"
description = "Sequential Fuzzing in Ladder Diagrams for PLC Vulnerability Detection using Seq-GAN"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sizzler Contributors"}
]
keywords = ["fuzzing", "PLC", "ladder-logic", "GAN", "security", "vulnerability-detection", "AFL"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
cuda = [
    "torch>=2.0.0",
]

[project.scripts]
sizzler = "sizzler.main:main"

[project.urls]
Homepage = "https://github.com/Frosty1442/Sizzler"
Repository = "https://github.com/Frosty1442/Sizzler"

[tool.setuptools]
packages = ["sizzler", "sizzler.models", "sizzler.training", "sizzler.utils"]

[tool.setuptools.package-data]
sizzler = ["*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | Fuzzing
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=sizzler --cov-report=html --cov-report=term-missing"
